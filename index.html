<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Питомник «Полынь»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Base surfaces — cool porcelain neutral unifies grey-blue, orange, cozy photos */
    --paper: #F4F3F1;
    --paper-alt: #FBFAF9;
    --panel: #FFFFFF;
    --ink: #1C1D1F;
    --ink-soft: #6B6E72;
    --ink-faint: #9A9DA1;
    --line: #E5E4E1;
    --line-soft: #EDECEA;
    /* Accent — muted terracotta echoes orange-set photos */
    --accent: #B15C3C;
    --accent-ink: #98492E;
    --accent-soft: #F1E4DD;
    /* Secondary — slate blue echoes grey-blue-set */
    --slate: #566072;
    --slate-soft: #E7EAEF;
    /* Legacy aliases for JS-generated avatars */
    --sage: var(--slate);
    --sage-soft: var(--slate-soft);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-lg: 22px;
    --shadow-sm: 0 1px 2px rgba(28,29,31,0.04), 0 4px 14px -8px rgba(28,29,31,0.12);
    --shadow-md: 0 2px 6px rgba(28,29,31,0.05), 0 18px 40px -22px rgba(28,29,31,0.30);
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    line-height:1.6;
    letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  ::selection{background:var(--accent-soft);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:6px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  .wrap{max-width:920px;margin:0 auto;padding:0 24px 80px;}

  /* Header */
  header.site{
    padding:34px 24px 22px;
    max-width:920px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:44px;height:44px;flex:none;}
  .brand-text h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:27px;
    line-height:1.1;
    margin:0;
    letter-spacing:-0.02em;
  }
  .brand-text p{
    margin:5px 0 0;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--ink-soft);
  }
  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--panel);
    padding:4px;
    border-radius:999px;
    border:1px solid var(--line);
    box-shadow:var(--shadow-sm);
  }
  nav.tabs button{
    border:none;
    background:transparent;
    padding:9px 20px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:500;
    color:var(--ink-soft);
    transition:background 0.2s var(--ease), color 0.2s var(--ease);
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{background:var(--ink);color:#fff;}

  /* View fade */
  .view{animation:fadeIn 0.35s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* Catalog */
  .catalog-head{
    padding:36px 0 8px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .catalog-head h2{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0;
  }
  .catalog-head .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    background:var(--panel);
    border:1px solid var(--line);
    padding:5px 12px;
    border-radius:999px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
    padding-top:20px;
  }
  @media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:460px){.grid{grid-template-columns:1fr;}}
  
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px 18px;
    display:block;
    box-shadow:var(--shadow-sm);
    transition:transform 0.28s var(--ease), box-shadow 0.28s var(--ease), border-color 0.28s var(--ease);
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:#D8D6D2;
    box-shadow:var(--shadow-md);
  }
  .card .avatar-row{
    display:flex;
    justify-content:center;
    align-items:center;
    width:88px;
    height:88px;
    margin:0 auto 16px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%, var(--paper-alt), var(--paper));
    border:1px solid var(--line-soft);
  }
  .card h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-align:center;
  }
  .meta-row{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.02em;
    padding:4px 10px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tag.sex-m{background:var(--slate-soft);border-color:transparent;color:var(--slate);}
  .tag.sex-f{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);}

  /* Detail page */
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:30px;
    font-size:13px;
    font-weight:500;
    color:var(--ink-soft);
    border:1px solid var(--line);
    background:var(--panel);
    padding:9px 16px 9px 12px;
    border-radius:999px;
    box-shadow:var(--shadow-sm);
    transition:border-color 0.2s var(--ease), color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .back-btn:hover{border-color:#D8D6D2; color:var(--ink); background:var(--paper-alt);}

  .detail-hero{
    display:flex;
    gap:34px;
    align-items:center;
    padding:34px 0 8px;
    flex-wrap:wrap;
  }
  .detail-hero .avatar-big{
    flex:none;
    width:168px;
    height:168px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 42%, var(--paper-alt), var(--paper));
    border:1px solid var(--line-soft);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .detail-hero h2{
    font-family:'Fraunces',serif;
    font-size:38px;
    font-weight:600;
    line-height:1.05;
    letter-spacing:-0.025em;
    margin:0 0 10px;
  }
  .detail-hero .subtitle{
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin:0;
  }

  .facts{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-top:30px;
    box-shadow:var(--shadow-sm);
  }
  @media (max-width:640px){.facts{grid-template-columns:repeat(2,1fr);}}
  .fact{
    background:var(--panel);
    padding:18px 20px;
  }
  .fact .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 7px;
  }
  .fact .value{
    font-size:15px;
    font-weight:500;
    margin:0;
  }
  .fact .value a{color:var(--accent-ink); border-bottom:1px solid var(--accent-soft); transition:border-color 0.18s;}
  .fact .value a:hover{border-bottom-color:var(--accent);}

  section.block{margin-top:44px;}
  section.block h3{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:-0.015em;
    margin:0 0 5px;
  }
  section.block .hint{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 22px;
  }

  /* Pedigree tree */
  .tree{font-size:14px;}
  .tree-node{position:relative;margin:0;padding:0;list-style:none;}
  .tree-node .card-line{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:9px 15px 9px 11px;
    margin:6px 0;
    box-shadow:var(--shadow-sm);
    transition:border-color 0.18s var(--ease);
  }
  .tree-node .card-line:hover{border-color:#D8D6D2;}
  .tree-node .card-line.self{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:none;
  }
  .tree-node .role{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-soft);
    width:52px;
    flex:none;
  }
  .tree-node .name{font-weight:600;}
  .tree-node .name a{color:var(--ink); border-bottom:1px solid var(--accent); transition:color 0.18s;}
  .tree-node .name a:hover{color:var(--accent-ink);}
  .tree-node .name.unlinked{color:var(--ink-soft); font-weight:500;}
  .tree-node .swatch{width:9px;height:9px;border-radius:50%;flex:none;}
  .tree-children{
    list-style:none;
    margin:0;
    padding-left:26px;
    border-left:1px solid var(--line);
  }
  .tree-node > .tree-children{margin-top:2px;}

  .unknown-note{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    padding:10px 0 0 2px;
  }

  /* Descendants */
  .desc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:640px){.desc-grid{grid-template-columns:repeat(2,1fr);}}
  .desc-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:13px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:var(--shadow-sm);
    transition:border-color 0.22s var(--ease), transform 0.22s var(--ease), box-shadow 0.22s var(--ease);
  }
  .desc-card:hover{border-color:#D8D6D2; transform:translateY(-2px); box-shadow:var(--shadow-md);}
  .desc-card .name{font-weight:600; font-size:13.5px;}
  .desc-card .sub{font-size:11.5px; color:var(--ink-soft);}

  /* Footer */
  footer.site{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-faint);
    padding:56px 24px 40px;
    margin-top:40px;
    border-top:1px solid var(--line);
    max-width:920px;
    margin-left:auto;
    margin-right:auto;
  }

  /* Photo gallery */
  .photo-gallery{display:flex;flex-direction:column;gap:10px;flex:none;}
  .photo-main{
    position:relative;
    width:168px;
    height:210px;
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:var(--paper-alt);
    border:1px solid var(--line);
    box-shadow:var(--shadow-md);
    cursor:zoom-in;
    padding:0;
  }
  .photo-main img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.35s var(--ease);
    filter:saturate(0.94) contrast(1.03) brightness(1.01);
  }
  .photo-main:hover img{transform:scale(1.03);}
  .photo-main::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(transparent 55%, rgba(28,29,31,0.28));
    opacity:0;
    transition:opacity 0.2s;
  }
  .photo-main:hover::after{opacity:1;}
  .photo-thumbs{display:flex;gap:7px;flex-wrap:wrap;max-width:168px;}
  .thumb{
    width:38px;
    height:44px;
    padding:0;
    border-radius:8px;
    overflow:hidden;
    border:1.5px solid transparent;
    opacity:0.55;
    transition:opacity 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
    background:none;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.94) contrast(1.03) brightness(1.01);}
  .thumb:hover{opacity:0.9;}
  .thumb.active{opacity:1; border-color:var(--accent); transform:translateY(-1px);}

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,21,23,0.96);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:32px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:min(88vw, 760px);
    max-height:80vh;
    border-radius:var(--radius);
    box-shadow:0 40px 90px -28px rgba(0,0,0,0.62);
    animation:fadeIn 0.2s ease both;
  }
  .lightbox button{
    position:absolute;
    border:none;
    background:rgba(255,255,255,0.08);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background 0.15s;
  }
  .lightbox button:hover{background:rgba(255,255,255,0.2);}
  .lightbox-close{top:20px; right:24px; width:40px; height:40px; border-radius:50%; font-size:18px;}
  .lightbox-nav{top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; font-size:22px;}
  .lightbox-nav.prev{left:16px;}
  .lightbox-nav.next{right:16px;}
  .lightbox-counter{
    position:absolute;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,0.72);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.03em;
  }
  @media (max-width:560px){
    .lightbox{padding:16px;}
    .lightbox-nav{width:40px;height:40px;font-size:18px;}
  }

  /* Responsive */
  @media (max-width:640px){
    .detail-hero{flex-direction:column; align-items:flex-start; gap:22px; padding-top:26px;}
    .detail-hero .photo-main,
    .detail-hero .avatar-big{margin:0 auto;}
    .detail-hero h2{font-size:30px;}
  }
  @media (max-width:420px){
    header.site{flex-direction:column; align-items:flex-start; gap:16px;}
    nav.tabs{align-self:flex-start;}
    .brand-text h1{font-size:24px;}
    .detail-hero h2{font-size:26px;}
  }
  /* Card photo wrapper (for cards with real photos) */
  .card-photo{
    width:100%;
    aspect-ratio:4/5;
    border-radius:10px;
    background:var(--paper-alt);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:16px;
  }
  .card-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.35s var(--ease);
    filter:saturate(0.94) contrast(1.03) brightness(1.01);
  }
  .card:hover .card-photo img{transform:scale(1.03);}

  /* Static pages */
  .page-text{padding:40px 0 40px; max-width:620px;}
  .page-text h2{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 18px;
  }
  .page-text p{font-size:15px; line-height:1.75; color:var(--ink-soft); margin:0 0 14px;}
  .page-text .joke-card{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:500;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 22px;
    margin-top:6px;
    box-shadow:var(--shadow-sm);
  }

  /* Status badges */
  .badge-status{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 11px;
    border-radius:999px;
    white-space:nowrap;
    display:inline-block;
  }
  .badge-status.is-current{background:var(--slate-soft); color:var(--slate);}
  .badge-status.is-former{background:var(--accent-soft); color:var(--accent-ink);}

  /* Home page */
  .home-section{margin-bottom:48px;}
  .home-section:last-child{margin-bottom:0;}
  .home-section h2{
    font-family:'Fraunces',serif;
    font-size:28px;
    font-weight:600;
    letter-spacing:-0.02em;
    margin:0 0 16px;
  }
  .home-section p{
    font-size:15px;
    line-height:1.75;
    color:var(--ink-soft);
    margin:0 0 14px;
    max-width:640px;
  }
  .home-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:0 0 48px;
  }
  .home-cta{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .home-cta a{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:0.03em;
    color:var(--accent-ink);
    border-bottom:1px solid var(--accent-soft);
    padding-bottom:1px;
    transition:border-color 0.15s;
  }
  .home-cta a:hover{border-bottom-color:var(--accent);}
</style>
</head>
<body>

<header class="site">
  <div class="brand-text">
    <h1>Питомник «Полынь»</h1>
    <p>Британская короткошёрстная · родословные с 2019 года</p>
  </div>
  <nav class="tabs">
    <button data-nav="home" class="active" type="button">Главная</button>
    <button data-nav="current" type="button">Сейчас в питомнике</button>
    <button data-nav="archive" type="button">Архив</button>
    <button data-nav="about" type="button">О нас</button>
    <button data-nav="contacts" type="button">Контакты</button>
  </nav>
</header>

<div class="wrap" id="app"></div>

<footer class="site">Черновой прототип сайта — можно менять состав, тексты и разделы.</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" data-lightbox-close aria-label="Закрыть">✕</button>
  <button class="lightbox-nav prev" data-lightbox-prev aria-label="Предыдущее фото">‹</button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav next" data-lightbox-next aria-label="Следующее фото">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script>
const COLORS = {
  'дымчатый голубой': '#7C8798',
  'кремовый': '#E8D3AC',
  'чёрный': '#2B2A28',
  'рыжий': '#C9793B',
  'черепаховый': null
};

let cats = [];

function getCat(id){ return cats.find(c => c.id === id); }
function currentCats(){ return cats.filter(c => c.current); }
function childrenOf(id){ return cats.filter(c => c.motherId === id || c.fatherId === id); }

function swatch(color){
  if(color === 'черепаховый'){
    return `<span class="swatch" style="background:linear-gradient(135deg, #2B2A28 50%, #C9793B 50%)"></span>`;
  }
  return `<span class="swatch" style="background:${COLORS[color] || '#999'}"></span>`;
}

function avatar(cat, size){
  const c = cat.color === 'черепаховый' ? '#2B2A28' : (COLORS[cat.color] || '#999');
  const c2 = cat.color === 'черепаховый' ? '#C9793B' : c;
  const s = size;
  return `
  <svg width="${s}" height="${s}" viewBox="0 0 100 100" fill="none">
    <path d="M22 34 L30 12 L40 30 Z" fill="${c}"/>
    <path d="M78 34 L70 12 L60 30 Z" fill="${c2}"/>
    <ellipse cx="50" cy="56" rx="34" ry="30" fill="${c}"/>
    ${cat.color === 'черепаховый' ? `<path d="M50 26 Q75 30 84 56 Q80 86 50 86 Z" fill="${c2}" opacity="0.85"/>` : ''}
    <circle cx="39" cy="52" r="4" fill="var(--paper)"/>
    <circle cx="61" cy="52" r="4" fill="var(--paper)"/>
    <path d="M46 66 Q50 70 54 66" stroke="var(--paper)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function sexTag(sex){
  return `<span class="tag ${sex === 'м' ? 'sex-m' : 'sex-f'}">${sex === 'м' ? 'кот' : 'кошка'}</span>`;
}

function parentLink(id){
  if(!id) return null;
  const p = getCat(id);
  if(!p) return null;
  return p;
}

function cardPhoto(cat, size){
  const photos = cat.photos || [];
  if(photos.length){
    return `<div class="card-photo"><img src="photos/${cat.id}/${photos[0]}" alt="${cat.name}"></div>`;
  }
  return `<div class="avatar-row">${avatar(cat, size)}</div>`;
}

function renderCatalog(){
  const list = currentCats();
  return `
  <div class="view">
    <div class="catalog-head">
      <h2>Котики на данный момент</h2>
      <span class="count">${list.length} в питомнике</span>
    </div>
    <div class="grid">
      ${list.map(cat => `
        <a class="card" href="#" data-cat="${cat.id}">
          ${cardPhoto(cat, 68)}
          <h3>${cat.name}</h3>
          <div class="meta-row">
            ${sexTag(cat.sex)}
            <span class="tag">${cat.age}</span>
          </div>
          <div class="meta-row" style="margin-top:6px;">
            <span class="tag" style="display:inline-flex;align-items:center;gap:5px;">${swatch(cat.color)}${cat.color}</span>
          </div>
        </a>
      `).join('')}
    </div>
  </div>`;
}

function buildAncestorNode(cat, role){
  if(!cat){
    return `<li class="tree-node"><div class="card-line"><span class="role">${role}</span><span class="name unlinked">неизвестно</span></div></li>`;
  }
  const mother = parentLink(cat.motherId);
  const father = parentLink(cat.fatherId);
  const hasParents = mother || father;
  return `
    <li class="tree-node">
      <div class="card-line">
        <span class="role">${role}</span>
        ${swatch(cat.color)}
        <span class="name ${cat.hasPage ? '' : 'unlinked'}">
          ${cat.hasPage ? `<a href="#" data-cat="${cat.id}">${cat.name}</a>` : cat.name}
        </span>
      </div>
      ${hasParents ? `
        <ul class="tree-children">
          ${buildAncestorNode(father, 'отец')}
          ${buildAncestorNode(mother, 'мать')}
        </ul>` : ''}
    </li>`;
}

function renderDetail(id){
  const cat = getCat(id);
  const mother = parentLink(cat.motherId);
  const father = parentLink(cat.fatherId);
  const kids = childrenOf(cat.id).filter(c => c.current);

  const pedigreeHTML = cat.unknownPedigree
    ? `<p class="unknown-note">Родословная неизвестна — ${cat.name} найден котёнком и попал в питомник без документов.</p>`
    : `<ul class="tree" style="list-style:none;padding:0;margin:0;">
        <li class="tree-node">
          <div class="card-line self">${swatch(cat.color)}<span class="name">${cat.name}</span></div>
          <ul class="tree-children">
            ${buildAncestorNode(father, 'отец')}
            ${buildAncestorNode(mother, 'мать')}
          </ul>
        </li>
      </ul>`;

  const photos = cat.photos || [];
  const media = photos.length
    ? `<div class="photo-gallery">
        <button class="photo-main" data-gallery-open data-photo-cat="${cat.id}" data-photo-index="0">
          <img src="photos/${cat.id}/${photos[0]}" alt="${cat.name}">
        </button>
        ${photos.length > 1 ? `<div class="photo-thumbs">
          ${photos.map((p, i) => `<button class="thumb ${i === 0 ? 'active' : ''}" data-thumb data-photo-cat="${cat.id}" data-photo-index="${i}"><img src="photos/${cat.id}/${p}" alt=""></button>`).join('')}
        </div>` : ''}
      </div>`
    : `<div class="avatar-big">${avatar(cat, 90)}</div>`;

  return `
  <div class="view">
    <a class="back-btn" href="#current" data-back="1">← Питомник</a>
    <div class="detail-hero">
      ${media}
      <div>
        <h2>${cat.name}</h2>
        <p class="subtitle">${cat.sex === 'м' ? 'Кот' : 'Кошка'} · ${cat.color}</p>
        ${!cat.current ? `<span class="badge-status is-former" style="margin-top:10px;">больше не в питомнике${cat.note ? ' · ' + cat.note : ''}</span>` : ''}
      </div>
    </div>

    <div class="facts">
      <div class="fact"><p class="label">Пол</p><p class="value">${cat.sex === 'м' ? 'Кот' : 'Кошка'}</p></div>
      <div class="fact"><p class="label">Возраст</p><p class="value">${cat.age}</p></div>
      <div class="fact"><p class="label">Окрас</p><p class="value">${cat.color}</p></div>
      <div class="fact"><p class="label">Родители</p><p class="value">
        ${father ? (father.hasPage ? `<a href="#" data-cat="${father.id}">${father.name}</a>` : father.name) : '—'}
        ${mother ? ` / ${mother.hasPage ? `<a href="#" data-cat="${mother.id}">${mother.name}</a>` : mother.name}` : (father ? '' : '')}
        ${!father && !mother ? 'неизвестны' : ''}
      </p></div>
    </div>

    <section class="block">
      <h3>Родословная</h3>
      <p class="hint">Клик по имени открывает страницу кота, если она есть в питомнике.</p>
      ${pedigreeHTML}
    </section>

    ${kids.length ? `
    <section class="block">
      <h3>Потомки</h3>
      <p class="hint">Котята ${cat.name}, которые сейчас есть в питомнике.</p>
      <div class="desc-grid">
        ${kids.map(k => `
          <a class="desc-card" href="#" data-cat="${k.id}">
            ${avatar(k, 40)}
            <div>
              <div class="name">${k.name}</div>
              <div class="sub">${k.age}</div>
            </div>
          </a>
        `).join('')}
      </div>
    </section>` : ''}
  </div>`;
}

function renderHome(){
  return `
  <div class="view">
    <div class="home-section" style="padding-top:36px;">
      <h2>О породе</h2>
      <p>Британская короткошёрстная — одна из самых узнаваемых пород: плотное, компактное тело, широкая грудь, короткие крепкие лапы и круглая мордочка с полными щеками. Шерсть густая, плюшевая, стоит «плюшевым» слоем — из-за этого порода и получила репутацию «медвежонка».</p>
      <p>Характер спокойный и независимый, но не отстранённый: британцы привязываются к дому и хозяевам, легко переносят одиночество днём и не требуют повышенной активности — это одна из самых удобных пород для городской квартиры.</p>
      <p>Уход не сложен: шерсть короткая, но из-за плотного подшёрстка нуждается в регулярном вычёсывании, особенно в период линьки.</p>
    </div>

    <hr class="home-divider">

    <div class="home-section">
      <h2>О питомнике</h2>
      <p>Питомник «Полынь» занимается разведением британских короткошёрстных с 2019 года — небольшое семейное хозяйство, несколько проверенных линий, родословные до третьего колена.</p>
      <div class="home-cta">
        <a href="#" data-nav-link="current">Смотреть котиков в питомнике →</a>
        <a href="#" data-nav-link="about">Подробнее о питомнике →</a>
      </div>
    </div>
  </div>`;
}

function renderAbout(){
  return `
  <div class="view page-text">
    <h2>О питомнике</h2>
    <p>Питомник «Полынь» занимается разведением британских короткошёрстных кошек с 2019 года. Мы небольшое семейное хозяйство: у нас нет конвейера — только несколько проверенных линий, за которыми мы наблюдаем не первый год.</p>
    <p>Каждый котёнок растёт в доме, а не в вольере, с рождения привыкает к людям и получает всё необходимое ветеринарное сопровождение. Мы ведём родословные и стараемся, чтобы будущие хозяева могли увидеть, откуда у котёнка характер и окрас.</p>
    <p>На этом сайте можно посмотреть, кто сейчас живёт в питомнике, заглянуть в архив всех котиков, которые когда-либо у нас жили, и изучить родословную каждого — вплоть до его предков и потомков.</p>
  </div>`;
}

function renderContacts(){
  return `
  <div class="view page-text">
    <h2>Контакты</h2>
    <div class="joke-card">Пока с нами нельзя поконтактировать.</div>
  </div>`;
}

function renderArchive(){
  const list = cats
    .filter(c => c.hasPage)
    .sort((a, b) => (b.current === true) - (a.current === true));
  return `
  <div class="view">
    <div class="catalog-head">
      <h2>Архив питомника</h2>
      <span class="count">${list.length} за всё время</span>
    </div>
    <div class="grid">
      ${list.map(cat => `
        <a class="card" href="#" data-cat="${cat.id}">
          ${cardPhoto(cat, 68)}
          <h3>${cat.name}</h3>
          <div class="meta-row">
            ${sexTag(cat.sex)}
            <span class="tag">${cat.age || '—'}</span>
          </div>
          <div class="meta-row" style="margin-top:6px;">
            <span class="badge-status ${cat.current ? 'is-current' : 'is-former'}">${cat.current ? 'сейчас в питомнике' : 'больше не здесь'}</span>
          </div>
        </a>
      `).join('')}
    </div>
  </div>`;
}

function getView(){
  const hash = location.hash;
  if(hash.startsWith('#cat=')) return { type:'detail', id: hash.replace('#cat=', '') };
  if(hash === '#current') return { type:'catalog' };
  if(hash === '#archive') return { type:'archive' };
  if(hash === '#about') return { type:'about' };
  if(hash === '#contacts') return { type:'contacts' };
  return { type:'home' };
}

function updateNavActive(view){
  const map = { detail:'current', catalog:'current', archive:'archive', about:'about', contacts:'contacts', home:'home' };
  const activeKey = map[view.type];
  document.querySelectorAll('nav.tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-nav') === activeKey);
  });
}

function render(){
  const view = getView();
  const app = document.getElementById('app');
  if(view.type === 'detail'){
    app.innerHTML = renderDetail(view.id);
  } else if(view.type === 'catalog'){
    app.innerHTML = renderCatalog();
  } else if(view.type === 'archive'){
    app.innerHTML = renderArchive();
  } else if(view.type === 'about'){
    app.innerHTML = renderAbout();
  } else if(view.type === 'contacts'){
    app.innerHTML = renderContacts();
  } else {
    app.innerHTML = renderHome();
  }
  updateNavActive(view);
  window.scrollTo({top:0, behavior:'instant'});
}

document.querySelector('nav.tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-nav]');
  if(!btn) return;
  const key = btn.getAttribute('data-nav');
  location.hash = key === 'home' ? '' : '#' + key;
});

document.getElementById('app').addEventListener('click', (e) => {
  const thumbBtn = e.target.closest('[data-thumb]');
  const mainPhoto = e.target.closest('[data-gallery-open]');
  const catLink = e.target.closest('[data-cat]');
  const backLink = e.target.closest('[data-back]');
  const navLink = e.target.closest('[data-nav-link]');

  if(thumbBtn){
    e.preventDefault();
    const catId = thumbBtn.getAttribute('data-photo-cat');
    const idx = parseInt(thumbBtn.getAttribute('data-photo-index'), 10);
    const cat = getCat(catId);
    const main = document.querySelector('.photo-main');
    main.querySelector('img').src = `photos/${catId}/${cat.photos[idx]}`;
    main.setAttribute('data-photo-index', idx);
    document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
    thumbBtn.classList.add('active');
    return;
  }
  if(mainPhoto){
    e.preventDefault();
    const catId = mainPhoto.getAttribute('data-photo-cat');
    const idx = parseInt(mainPhoto.getAttribute('data-photo-index'), 10);
    openLightbox(catId, idx);
    return;
  }
  if(navLink){
    e.preventDefault();
    location.hash = '#' + navLink.getAttribute('data-nav-link');
    return;
  }
  if(catLink){
    e.preventDefault();
    location.hash = '#cat=' + catLink.getAttribute('data-cat');
  } else if(backLink){
    e.preventDefault();
    location.hash = '#current';
  }
});
window.addEventListener('hashchange', render);

let lightboxCat = null;
let lightboxIndex = 0;

function openLightbox(catId, index){
  lightboxCat = getCat(catId);
  lightboxIndex = index;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  lightboxCat = null;
}
function updateLightbox(){
  if(!lightboxCat) return;
  const photos = lightboxCat.photos;
  lightboxIndex = (lightboxIndex + photos.length) % photos.length;
  document.getElementById('lightbox-img').src = `photos/${lightboxCat.id}/${photos[lightboxIndex]}`;
  document.getElementById('lightbox-img').alt = lightboxCat.name;
  document.getElementById('lightbox-counter').textContent = `${lightboxIndex + 1} / ${photos.length}`;
  const showNav = photos.length > 1;
  document.querySelector('[data-lightbox-prev]').style.display = showNav ? 'flex' : 'none';
  document.querySelector('[data-lightbox-next]').style.display = showNav ? 'flex' : 'none';
}
function navLightbox(delta){
  lightboxIndex += delta;
  updateLightbox();
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if(e.target.closest('[data-lightbox-close]')){ closeLightbox(); return; }
  if(e.target.closest('[data-lightbox-prev]')){ navLightbox(-1); return; }
  if(e.target.closest('[data-lightbox-next]')){ navLightbox(1); return; }
  if(e.target.id === 'lightbox'){ closeLightbox(); }
});
document.addEventListener('keydown', (e) => {
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') navLightbox(-1);
  if(e.key === 'ArrowRight') navLightbox(1);
});

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<p style="padding:60px 0;color:var(--ink-soft);text-align:center;">Загрузка котиков…</p>';
  try {
    const idxRes = await fetch('data/cats/index.json');
    if(!idxRes.ok) throw new Error('index.json недоступен');
    const ids = await idxRes.json();
    cats = await Promise.all(ids.map(async id => {
      const res = await fetch(`data/cats/${id}.json`);
      if(!res.ok) throw new Error(`data/cats/${id}.json недоступен`);
      return res.json();
    }));
    render();
  } catch(err){
    console.error(err);
    app.innerHTML = `
      <div style="padding:60px 0;color:var(--ink-soft);max-width:520px;">
        <p style="font-weight:600;color:var(--ink);margin-bottom:8px;">Не удалось загрузить данные о котиках.</p>
        <p style="font-size:13px;line-height:1.5;">
          Если вы открыли этот файл напрямую двойным щелчком (адрес начинается с <code>file://</code>) —
          браузер блокирует такие запросы из соображений безопасности.
          Откройте сайт через GitHub Pages, либо запустите локальный сервер в папке с сайтом
          (например, <code>npx serve</code> или <code>python -m http.server</code>) и зайдите по адресу
          <code>http://localhost:...</code>.
        </p>
      </div>`;
  }
}
init();
</script>
</body>
</html>
